[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-hijack"
version = "0.1.0"
description = "Red-team Bluetooth (BR/EDR + BLE) hijacking framework"
requires-python = ">=3.10"
dependencies = [
    "bluez-peripheral>=0.1.7",
]

[project.scripts]
bthj = "bthj.cli:main"

[tool.setuptools.packages.find]
include = ["bthj*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]